<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Quicknotes </h1>
        <p>Capture thoughts instantly. Access them anywhere.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">Note Content:</label>
                <input type="text" id="note-input" name="note-input" placeholder="Enter your note..."
                    autocomplete="off">
                <label for="note-category">Category:</label>
                <select id="note-category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <section>
            <h2>Your notes</h2>
            <input type="text" id="search-input" placeholder="Search notes...">
            <p id="note-count">You have no notes yet.</p>

            <button id="clear-all-btn" type="button">Clear All</button>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>&copy; 2026 QuickNotes</footer>
</body>

</html>
